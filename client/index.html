<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Fixed scale: the app is sized for phones, pinch zoom is turned off -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>EcoBud · Gérer son budget étudiant facilement</title>
    <meta name="description" content="EcoBud, l’appli gratuite pour gérer son budget étudiant : note tes dépenses en 5 secondes, vois ce qu’il te reste ce mois-ci et reçois un rappel le soir. Sans connexion bancaire." />
    <link rel="canonical" href="https://ecobud-app.vercel.app/" />
    <!-- Preview card when the link is shared (messaging apps, social networks) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EcoBud" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://ecobud-app.vercel.app/" />
    <meta property="og:title" content="EcoBud · Gérer son budget étudiant facilement" />
    <meta property="og:description" content="Note tes dépenses en 5 secondes et vois ce qu’il te reste ce mois-ci. Gratuit, sans connexion bancaire." />
    <meta property="og:image" content="https://ecobud-app.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="L’appli EcoBud sur un téléphone, avec le reste à dépenser du mois" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#e3e7f0" />
    <!-- Applies the last theme before the first paint; a separate file so the security policy can forbid inline scripts -->
    <script src="/theme-boot.js"></script>
    <!-- iPhone: icon and full screen mode once added to the home screen -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EcoBud" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
