<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Fixed scale: the app is sized for phones, pinch zoom is turned off -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>EcoBud</title>
    <meta name="description" content="Ton budget étudiant, sans prise de tête." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#e3e7f0" />
    <!-- Applies the last theme before the page is drawn, so it never flashes in the wrong colors -->
    <script>
      try {
        var theme = JSON.parse(localStorage.getItem("ecobud_theme")) || {};
        document.documentElement.dataset.skin = theme.skin || "ticket";
        document.documentElement.dataset.mode = theme.appearance || "auto";
      } catch (e) {}
    </script>
    <!-- iPhone: icon and full screen mode once added to the home screen -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EcoBud" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
