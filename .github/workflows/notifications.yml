# Asks the API to send the notifications that are due; cron-job.org calls it every 15 minutes
# GitHub delays its scheduled runs by hours, so this one only runs by hand from the Actions tab
name: Notifications

on:
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due notifications
        env:
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST "https://ecobud-app.vercel.app/api/jobs/run" \
            -H "Authorization: Bearer $JOBS_SECRET"
